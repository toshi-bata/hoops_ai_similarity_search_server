name: tests

# Runs the SDK-free Python test suite. It needs no HOOPS AI SDK, no license,
# and no Node/front-end build (the @ts3d-hoops packages are private and cannot
# be fetched here), so no secrets are required.
# Runs on Windows because the server targets the HOOPS AI SDK on Windows and the
# suite has only ever been validated there.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
