[project]
name = "hoops-ai-similarity-mcp-server"
version = "0.1.0"
description = "MCP server that drives the HOOPS AI similarity search server from Claude Desktop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "mcp[cli]>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
